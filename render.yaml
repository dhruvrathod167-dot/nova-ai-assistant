# Render Configuration for NOVA AI
services:
  - type: web
    name: nova-ai-assistant
    env: node
    buildCommand: "prisma generate && npm run build"
    startCommand: "node scripts/render-start.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:/var/data/nova.db"
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXTAUTH_SECRET
        generateValue: true
        sync: false
      - key: NEXTAUTH_URL
        value: "https://nova-ai-assistant-3.onrender.com"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o-mini"
    healthCheck:
      path: /api/health
      interval: 30s
      timeout: 5s
      retries: 3
    disk:
      name: nova-data
      mountPath: /var/data
      sizeGB: 1
    cpu:
      kind: shared
      units: 2
    memory:
      sizeGB: 1
