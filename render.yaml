# Render Configuration for NOVA AI
services:
  - type: web
    name: nova-ai-assistant
    env: node
    buildCommand: "prisma generate && npm run build"
    startCommand: "node .next/standalone/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./prisma/dev.db"
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXTAUTH_SECRET
        generateValue: true
        sync: false
      - key: NEXTAUTH_URL
        value: "https://nova-ai-assistant-1-rr7x.onrender.com"
    healthCheck:
      path: /api/health
      interval: 30s
      timeout: 5s
      retries: 3
    disk:
      sizeGB: 1
    cpu:
      kind: shared
      units: 2
    memory:
      sizeGB: 1